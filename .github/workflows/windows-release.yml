name: Windows x64 Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows x64 executable
        run: cargo build --locked --release

      - name: Package executable and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }

          $staging = Join-Path $env:RUNNER_TEMP 'paradox-release'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item 'target/release/paradox.exe' $staging
          Copy-Item 'README.md' $staging
          Copy-Item 'LICENSE' $staging

          $archiveName = "paradox-$($env:RELEASE_TAG)-windows-x64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $archivePath -Force
          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -Path "$archivePath.sha256" -Encoding ascii

      - name: Upload assets to the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo $env:REPOSITORY
          gh release upload $env:RELEASE_TAG `
            (Join-Path $env:RUNNER_TEMP "paradox-$($env:RELEASE_TAG)-windows-x64.zip") `
            (Join-Path $env:RUNNER_TEMP "paradox-$($env:RELEASE_TAG)-windows-x64.zip.sha256") `
            --repo $env:REPOSITORY --clobber
